[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bangla-retrieval-bench"
version = "0.1.0"
description = "Which retriever should a Bangla RAG system use? A reproducible benchmark of BM25 tokenizers, multilingual embedding models and hybrid fusion on Bangla questions."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jubayer Siddiki Ayan" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0"]
data = ["datasets>=2.19"]
dev = ["pytest>=8"]

[project.scripts]
brb = "brb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
